[package]
name = "lace"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
codex = { package = "codex-core", git = "https://github.com/openai/codex.git", rev = "f82e36592278a0a782fb0d0fc97e5fa10e832ac2" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
anyhow = "1"

# Cargo does not inherit patches from Git dependencies; these match Codex's workspace.
[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
